name: PostgreSQL 18 persistence integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  persistence:
    name: Build and verify tenant isolation
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.404

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Restore frontend dependencies
        working-directory: web/atendee-portal
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: web/atendee-portal
        run: npm audit --audit-level=moderate

      - name: Run frontend tests
        working-directory: web/atendee-portal
        run: npm test

      - name: Build frontend
        working-directory: web/atendee-portal
        run: npm run build

      - name: Install Chromium for portal browser tests
        working-directory: web/atendee-portal
        run: npx playwright install --with-deps chromium

      - name: Run portal browser E2E checks
        working-directory: web/atendee-portal
        run: npm run test:e2e

      - name: Restore locked dependencies
        run: dotnet restore Atendee.sln --locked-mode

      - name: Build Release
        run: dotnet build Atendee.sln --no-restore --configuration Release

      - name: Run domain checks
        run: dotnet run --project tests/Atendee.Domain.Checks/Atendee.Domain.Checks.csproj --no-build --configuration Release

      - name: Start isolated PostgreSQL 18.7
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

          ADMIN_TEST_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::${ADMIN_TEST_PASSWORD}"
          printf 'ATENDEE_TEST_POSTGRES_ADMIN_PASSWORD=%s\n' "${ADMIN_TEST_PASSWORD}" >> "${GITHUB_ENV}"

          docker run --detach --rm --name atendee-postgres18-ci \
            --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_USER=postgres \
            --env "POSTGRES_PASSWORD=${ADMIN_TEST_PASSWORD}" \
            --health-cmd 'pg_isready -U postgres -d postgres' \
            --health-interval 2s \
            --health-timeout 5s \
            --health-retries 30 \
            postgres:18.7-bookworm
          unset ADMIN_TEST_PASSWORD

          for attempt in $(seq 1 45); do
            HEALTH="$(docker inspect --format '{{.State.Health.Status}}' atendee-postgres18-ci 2>/dev/null || true)"
            if [[ "${HEALTH}" == "healthy" ]]; then
              # Verify PostgreSQL can actually accept connections and execute queries
              for verify_attempt in $(seq 1 5); do
                if docker exec atendee-postgres18-ci psql -U postgres -d postgres -Atqc 'SELECT 1;' >/dev/null 2>&1; then
                  docker exec atendee-postgres18-ci psql -U postgres -d postgres \
                    -Atqc 'SHOW server_version;' \
                    | sed 's/^/Disposable test server: PostgreSQL /'
                  # Extra stabilization wait after successful query
                  sleep 5
                  exit 0
                fi
                echo "PostgreSQL health check passed but query failed, retrying in 2s (attempt $verify_attempt/5)..."
                sleep 2
              done
              echo "PostgreSQL did not respond to queries after health check passed." >&2
              exit 1
            fi
            sleep 2
          done

          docker logs atendee-postgres18-ci || true
          echo 'PostgreSQL 18.7 did not become healthy.' >&2
          exit 1

      - name: Provision disposable database and restricted roles
        shell: bash
        run: |
          set -Eeuo pipefail

          APP_TEST_PASSWORD="$(openssl rand -hex 32)"
          AUTH_TEST_PASSWORD="$(openssl rand -hex 32)"
          MIGRATOR_TEST_PASSWORD="$(openssl rand -hex 32)"
          PROVISIONER_TEST_PASSWORD="$(openssl rand -hex 32)"
          RATE_LIMIT_PARTITION_SECRET="$(openssl rand -base64 32)"
          echo "::add-mask::${APP_TEST_PASSWORD}"
          echo "::add-mask::${AUTH_TEST_PASSWORD}"
          echo "::add-mask::${MIGRATOR_TEST_PASSWORD}"
          echo "::add-mask::$PROVISIONER_TEST_PASSWORD"
          echo "::add-mask::${RATE_LIMIT_PARTITION_SECRET}"
          export PGPASSWORD="${ATENDEE_TEST_POSTGRES_ADMIN_PASSWORD}"

          # Retry logic for provisioning - transient connection issues after health check
          for attempt in $(seq 1 5); do
            if createdb --host 127.0.0.1 --username postgres atendee_rls_lab 2>/dev/null; then
              break
            fi
            if [[ $attempt -eq 5 ]]; then
              echo "Failed to create database after 5 attempts"
              exit 1
            fi
            echo "Database creation failed, retrying in 3s (attempt $attempt/5)..."
            sleep 3
          done

          # Helper function to run psql with retry
          run_psql() {
            local description="$1"
            shift
            for attempt in $(seq 1 5); do
              if psql --no-psqlrc --set ON_ERROR_STOP=1 "$@" 2>/dev/null; then
                return 0
              fi
              if [[ $attempt -eq 5 ]]; then
                echo "Failed: $description after 5 attempts"
                exit 1
              fi
              echo "Retrying $description in 3s (attempt $attempt/5)..."
              sleep 3
            done
          }

          run_psql "roles template" --host 127.0.0.1 --username postgres --dbname atendee_rls_lab --file db/security/001_roles_template.sql
          run_psql "identity provisioner role" --host 127.0.0.1 --username postgres --dbname atendee_rls_lab --file db/security/002_identity_provisioner_role.sql

          run_psql "atendee_app_login password" --host 127.0.0.1 --username postgres --dbname atendee_rls_lab --command "ALTER ROLE atendee_app_login PASSWORD '${APP_TEST_PASSWORD}';"
          run_psql "atendee_auth_login password" --host 127.0.0.1 --username postgres --dbname atendee_rls_lab --command "ALTER ROLE atendee_auth_login PASSWORD '${AUTH_TEST_PASSWORD}';"
          run_psql "atendee_migrator password" --host 127.0.0.1 --username postgres --dbname atendee_rls_lab --command "ALTER ROLE atendee_migrator PASSWORD '${MIGRATOR_TEST_PASSWORD}';"
          run_psql "atendee_identity_provisioner password" --host 127.0.0.1 --username postgres --dbname atendee_rls_lab --command "ALTER ROLE atendee_identity_provisioner PASSWORD '$PROVISIONER_TEST_PASSWORD';"

          export PGPASSWORD="${MIGRATOR_TEST_PASSWORD}"
          run_psql "001_create_tenant_notes" --host 127.0.0.1 --username atendee_migrator --dbname atendee_rls_lab --file db/migrations/001_create_tenant_notes.sql
          run_psql "002_create_operational_identity" --host 127.0.0.1 --username atendee_migrator --dbname atendee_rls_lab --file db/migrations/002_create_operational_identity.sql
          run_psql "003_create_security_audit_events" --host 127.0.0.1 --username atendee_migrator --dbname atendee_rls_lab --file db/migrations/003_create_security_audit_events.sql
          run_psql "004_extend_security_audit_event_types" --host 127.0.0.1 --username atendee_migrator --dbname atendee_rls_lab --file db/migrations/004_extend_security_audit_event_types.sql
          run_psql "005_audit_tenant_membership_changes" --host 127.0.0.1 --username atendee_migrator --dbname atendee_rls_lab --file db/migrations/005_audit_tenant_membership_changes.sql
          run_psql "006_extend_security_audit_mfa_pending_and_enrollment_failure" --host 127.0.0.1 --username atendee_migrator --dbname atendee_rls_lab --file db/migrations/006_extend_security_audit_mfa_pending_and_enrollment_failure.sql
          run_psql "007_audit_tenant_status_changes" --host 127.0.0.1 --username atendee_migrator --dbname atendee_rls_lab --file db/migrations/007_audit_tenant_status_changes.sql
          run_psql "008_trusted_actor_for_trigger_audit" --host 127.0.0.1 --username atendee_migrator --dbname atendee_rls_lab --file db/migrations/008_trusted_actor_for_trigger_audit.sql
          run_psql "009_resolve_audit_target_tenant" --host 127.0.0.1 --username atendee_migrator --dbname atendee_rls_lab --file db/migrations/009_resolve_audit_target_tenant.sql
          run_psql "010_enforce_active_mfa_owner" --host 127.0.0.1 --username atendee_migrator --dbname atendee_rls_lab --file db/migrations/010_enforce_active_mfa_owner.sql
          run_psql "011_operational_identity_activation" --host 127.0.0.1 --username atendee_migrator --dbname atendee_rls_lab --file db/migrations/011_operational_identity_activation.sql
          run_psql "012_tenant_profile_projection" --host 127.0.0.1 --username atendee_migrator --dbname atendee_rls_lab --file db/migrations/012_tenant_profile_projection.sql
          run_psql "013_create_tenant_services" --host 127.0.0.1 --username atendee_migrator --dbname atendee_rls_lab --file db/migrations/013_create_tenant_services.sql
          run_psql "014_create_professional_profiles" --host 127.0.0.1 --username atendee_migrator --dbname atendee_rls_lab --file db/migrations/014_create_professional_profiles.sql
          run_psql "015_complete_tenant_onboarding" --host 127.0.0.1 --username atendee_migrator --dbname atendee_rls_lab --file db/migrations/015_complete_tenant_onboarding.sql
          run_psql "016_create_tenant_customers" --host 127.0.0.1 --username atendee_migrator --dbname atendee_rls_lab --file db/migrations/016_create_tenant_customers.sql
          run_psql "017_create_tenant_business_hours" --host 127.0.0.1 --username atendee_migrator --dbname atendee_rls_lab --file db/migrations/017_create_tenant_business_hours.sql
          run_psql "018_create_professional_availability" --host 127.0.0.1 --username atendee_migrator --dbname atendee_rls_lab --file db/migrations/018_create_professional_availability.sql
          run_psql "019_create_professional_time_off" --host 127.0.0.1 --username atendee_migrator --dbname atendee_rls_lab --file db/migrations/019_create_professional_time_off.sql
          run_psql "020_create_appointments_and_outbox" --host 127.0.0.1 --username atendee_migrator --dbname atendee_rls_lab --file db/migrations/020_create_appointments_and_outbox.sql
          run_psql "021_create_distributed_authentication_rate_limits" --host 127.0.0.1 --username atendee_migrator --dbname atendee_rls_lab --file db/migrations/021_create_distributed_authentication_rate_limits.sql
          run_psql "022_enforce_last_owner_protection" --host 127.0.0.1 --username atendee_migrator --dbname atendee_rls_lab --file db/migrations/022_enforce_last_owner_protection.sql

          printf '%s\n' \
            "ATENDEE_TEST_CONNECTION_STRING=Host=127.0.0.1;Port=5432;Database=atendee_rls_lab;Username=atendee_app_login;Password=${APP_TEST_PASSWORD};Pooling=true;Maximum Pool Size=1" \
            "ATENDEE_TEST_PROVISIONER_CONNECTION_STRING=Host=127.0.0.1;Port=5432;Database=atendee_rls_lab;Username=atendee_identity_provisioner;Password=$PROVISIONER_TEST_PASSWORD;Pooling=false" \
            "ATENDEE_TEST_IDENTITY_CONNECTION_STRING=Host=127.0.0.1;Port=5432;Database=atendee_rls_lab;Username=atendee_auth_login;Password=${AUTH_TEST_PASSWORD};Pooling=true;Maximum Pool Size=10" \
            "ATENDEE_TEST_MIGRATOR_CONNECTION_STRING=Host=127.0.0.1;Port=5432;Database=atendee_rls_lab;Username=atendee_migrator;Password=${MIGRATOR_TEST_PASSWORD};Pooling=false" \
            "AuthenticationRateLimiting__PartitionKeySecret=${RATE_LIMIT_PARTITION_SECRET}" \
            >> "${GITHUB_ENV}"
          printf 'ATENDEE_TEST_POSTGRES_ADMIN_PASSWORD=\n' >> "${GITHUB_ENV}"

          unset APP_TEST_PASSWORD AUTH_TEST_PASSWORD MIGRATOR_TEST_PASSWORD PROVISIONER_TEST_PASSWORD RATE_LIMIT_PARTITION_SECRET PGPASSWORD

      - name: Run EF Core and PostgreSQL RLS integration checks
        run: dotnet run --project tests/Atendee.Persistence.Checks/Atendee.Persistence.Checks.csproj --no-build --configuration Release

      - name: Run Identity, TOTP and tenant-context integration checks
        run: dotnet run --project tests/Atendee.Identity.Checks/Atendee.Identity.Checks.csproj --no-build --configuration Release

      - name: Run API HTTP authentication, session-security and full-stack browser checks
        env:
          ATENDEE_RUN_BROWSER_E2E: "true"
        run: dotnet run --project tests/Atendee.Api.HttpChecks/Atendee.Api.HttpChecks.csproj --no-build --configuration Release

      - name: Clear disposable database credentials from the job environment
        if: always()
        shell: bash
        run: |
          printf 'ATENDEE_TEST_CONNECTION_STRING=\n' >> "${GITHUB_ENV}"
          printf 'ATENDEE_TEST_IDENTITY_CONNECTION_STRING=\n' >> "${GITHUB_ENV}"
          printf 'ATENDEE_TEST_PROVISIONER_CONNECTION_STRING=\n' >> "$GITHUB_ENV"
          printf 'ATENDEE_TEST_MIGRATOR_CONNECTION_STRING=\n' >> "${GITHUB_ENV}"
          printf 'AuthenticationRateLimiting__PartitionKeySecret=\n' >> "${GITHUB_ENV}"

      - name: Remove disposable PostgreSQL container
        if: always()
        run: docker rm --force --volumes atendee-postgres18-ci || true
