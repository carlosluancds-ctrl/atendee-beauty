services:
  postgres:
    image: postgres:18.7-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Use scripts/test-rls.sh to create a temporary password}"
    volumes:
      - ./db/poc:/poc:ro
    # No host port is published. The DB is reachable only inside this
    # one-off Compose network and from docker compose exec.
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
